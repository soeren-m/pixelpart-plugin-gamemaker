name: Build
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows build
    uses: ./.github/workflows/windows_build.yml

  package:
    name: Package plugin
    runs-on: ubuntu-latest
    needs: [windows-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: pixelpart-windows
          path: artifacts/windows

      - name: Display downloaded artifacts
        run: ls -R artifacts

      - name: Copy binaries
        run: |
          cp -r artifacts/windows/*.dll ./pixelpart-plugin/extensions/Pixelpart/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelpart-plugin-gamemaker
          path: ./pixelpart-plugin
